<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wężoidy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">

    <!-- Ekran startowy -->
    <section id="start-screen" class="screen">
      <!-- Ilustracja: wąż płynący w stronę jabłka (kolory z style.css) -->
      <svg class="logo" viewBox="0 0 200 120" aria-hidden="true">
        <path class="logo-body" d="M16 88 C40 88 44 50 68 50 S96 88 120 88 S136 60 138 52"/>
        <circle class="logo-head" cx="140" cy="46" r="12"/>
        <circle class="logo-eye" cx="143" cy="40" r="3.2"/>
        <circle class="logo-eye" cx="147" cy="49" r="3.2"/>
        <circle class="logo-pupil" cx="143.8" cy="40" r="1.5"/>
        <circle class="logo-pupil" cx="147.8" cy="49" r="1.5"/>
        <g transform="translate(162 26) scale(1.4)">
          <path class="logo-apple" d="M12 7c-1.5-1-5-1.5-6.8 1.2C3.3 11 4.6 16.5 7.5 19.5c1.4 1.4 2.8 1.6 4.5.8 1.7.8 3.1.6 4.5-.8 2.9-3 4.2-8.5 2.3-11.3C17 5.5 13.5 6 12 7z"/>
          <path class="logo-stem" d="M12 7.5c0-2 .5-3.5 1.5-4.5"/>
          <path class="logo-leaf" d="M13 5c1-2.5 3.5-3 5.5-2.5-.5 2.5-3 3.5-5.5 2.5z"/>
        </g>
      </svg>
      <h1 class="title">Wężoidy</h1>
      <div class="levels">
        <button class="level-button" data-level="easy">Łatwy</button>
        <button class="level-button" data-level="medium">Średni</button>
        <button class="level-button" data-level="hard">Trudny</button>
      </div>
      <p class="hint">Sterowanie: strzałki lub WASD · Enter / spacja = start na poziomie Średnim</p>
    </section>

    <!-- Rozgrywka -->
    <section id="play-screen" class="screen hidden">
      <header class="scoreboard">
        <span id="score" class="score">0</span>
        <span id="level-name" class="level-name">Średni</span>
      </header>
      <div id="board" class="board"></div>
    </section>

    <!-- Ekran końca gry -->
    <section id="end-screen" class="screen hidden">
      <h2 id="end-title" class="title">Koniec gry</h2>
      <p class="final-score">Wynik: <span id="final-score">0</span></p>
      <button id="restart-button" class="level-button">Zagraj ponownie</button>
    </section>

  </main>
  <script src="game.js"></script>
</body>
</html>
